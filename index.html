<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRI - Control de Gastos y Vencimientos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b132b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER TRI -->
    <header class="glass-card sticky top-0 z-50 border-b border-slate-700/50 mb-6 px-4 py-3">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-teal-500 to-emerald-400 text-slate-950 font-black px-3.5 py-1.5 rounded-xl text-xl tracking-wider shadow-lg shadow-teal-500/20">
                    TRI
                </div>
                <div>
                    <h1 class="text-base font-bold leading-none text-white">Control de Gastos</h1>
                    <span id="statusBadge" class="text-xs text-amber-400 font-medium">Conectando...</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-file-excel"></i> Excel
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 space-y-6">

        <!-- ESTADÍSTICAS RÁPIDAS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card p-4 rounded-2xl border-l-4 border-teal-400">
                <p class="text-xs text-slate-400 font-medium">Total Gastos Registrados</p>
                <h3 id="statTotal" class="text-2xl font-black text-white mt-1">$0,00</h3>
            </div>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-amber-400">
                <p class="text-xs text-slate-400 font-medium">Próximos Vencimientos (sin pagar)</p>
                <h3 id="statPending" class="text-2xl font-black text-amber-300 mt-1">0</h3>
            </div>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-emerald-400">
                <p class="text-xs text-slate-400 font-medium">Estado Nube</p>
                <h3 id="statSync" class="text-sm font-bold text-emerald-400 mt-2">Conectando...</h3>
            </div>
        </div>

        <!-- FORMULARIO DE NUEVO GASTO -->
        <section class="glass-card p-5 rounded-2xl shadow-xl">
            <h2 class="text-sm font-semibold mb-4 text-teal-300 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-teal-400"></i> Registrar Nuevo Gasto o Vencimiento
            </h2>
            <form id="expenseForm" onsubmit="saveExpense(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Descripción / Concepto</label>
                    <input type="text" id="desc" list="logoNames" autocomplete="off" required placeholder="Ej: Supermercado / Netflix" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-white">
                    <datalist id="logoNames"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Monto</label>
                    <input type="text" id="amount" inputmode="decimal" autocomplete="off" required placeholder="$ 0" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Forma de Pago</label>
                    <select id="paymentMethod" onchange="toggleCardOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-white">
                        <option value="Efectivo / Transferencia">Efectivo / Transferencia</option>
                        <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                    </select>
                </div>

                <div class="col-span-1 md:col-span-2 lg:col-span-3">
                    <label class="block text-xs font-medium text-slate-300 mb-1">Logo (opcional)</label>
                    <div class="flex gap-2">
                        <select id="logoSelect" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-white">
                            <option value="">Sin logo</option>
                        </select>
                        <button type="button" onclick="toggleLogoPanel()" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 py-2 rounded-lg flex items-center gap-2 transition">
                            <i class="fa-solid fa-image"></i> Mis logos
                        </button>
                    </div>
                </div>

                <div id="cardDetails" class="hidden col-span-1 md:col-span-2 lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                    <div>
                        <label class="block text-xs font-medium text-amber-300 mb-1">Nombre / Alias de Referencia de la Tarjeta</label>
                        <input type="text" id="cardAlias" placeholder="Ej: Visa Santander / Débito Galicia" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Fecha de Vencimiento</label>
                        <input type="date" id="dueDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-white">
                    </div>
                </div>

                <div class="col-span-1 md:col-span-2 lg:col-span-3 flex justify-end">
                    <button type="submit" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-teal-500/20 transition flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-check"></i> Guardar en TRI
                    </button>
                </div>
            </form>

            <!-- PANEL DE LOGOS -->
            <div id="logoPanel" class="hidden mt-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-4">
                <h3 class="text-sm font-semibold text-amber-300 flex items-center gap-2">
                    <i class="fa-solid fa-images"></i> Mis logos
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Nombre del logo</label>
                        <input type="text" id="logoName" placeholder="Ej: Netflix / Edenor" onkeydown="if(event.key==='Enter'){event.preventDefault();saveLogo();}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Imagen</label>
                        <input type="file" id="logoFile" accept="image/*" class="w-full text-xs text-slate-300 file:mr-3 file:rounded-lg file:border-0 file:bg-slate-700 file:text-white file:px-3 file:py-2 file:text-xs file:cursor-pointer">
                    </div>
                    <div class="flex items-center gap-3">
                        <img id="logoPreview" alt="" class="hidden w-10 h-10 rounded-lg object-contain bg-slate-900 p-1">
                        <button type="button" onclick="saveLogo()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm px-4 py-2 rounded-lg transition flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> Guardar logo
                        </button>
                    </div>
                </div>
                <p id="logoMsg" class="text-xs text-slate-400 min-h-[1rem]"></p>
                <div id="logoList" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <!-- LISTA DE GASTOS -->
        <section class="glass-card p-5 rounded-2xl shadow-xl">
            <h2 class="text-sm font-semibold mb-4 text-slate-200 flex items-center justify-between gap-2 flex-wrap">
                <span>Historial y Vencimientos</span>
                <span id="counterBadge" class="text-xs bg-slate-800 text-teal-300 px-2.5 py-1 rounded-full font-mono">0 registros</span>
            </h2>

            <!-- FILTROS -->
            <div class="flex flex-wrap items-center gap-2 mb-4">
                <div id="statusChips" class="flex bg-slate-800 rounded-lg p-1 gap-1">
                    <button type="button" data-status="all" onclick="setStatusFilter('all')" class="text-xs font-semibold px-3 py-1.5 rounded-md transition bg-teal-500 text-slate-950">Todos</button>
                    <button type="button" data-status="pending" onclick="setStatusFilter('pending')" class="text-xs font-semibold px-3 py-1.5 rounded-md transition text-slate-300 hover:bg-slate-700">Sin pagar</button>
                    <button type="button" data-status="paid" onclick="setStatusFilter('paid')" class="text-xs font-semibold px-3 py-1.5 rounded-md transition text-slate-300 hover:bg-slate-700">Pagados</button>
                </div>
                <select id="methodFilter" onchange="setMethodFilter(this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-teal-400 text-white">
                    <option value="all">Todas las formas de pago</option>
                    <option value="Efectivo / Transferencia">Efectivo / Transferencia</option>
                    <option value="cards">Todas las tarjetas</option>
                    <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                </select>
                <input type="text" id="textFilter" oninput="setTextFilter(this.value)" placeholder="Buscar por concepto..." autocomplete="off" class="flex-1 min-w-[160px] bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-teal-400 text-white">
                <button type="button" onclick="clearFilters()" class="text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg transition">
                    <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar
                </button>
            </div>
            <p id="filteredTotal" class="text-xs text-slate-400 mb-3 hidden"></p>

            <div id="expenseList" class="space-y-3">
                <div class="text-center py-8 text-slate-400 text-sm">Cargando registros desde la nube...</div>
            </div>
        </section>
    </main>

    <!-- FIREBASE SDK & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXqG0SaBCS8bN42mQG8VcayYJuQGzdXfM",
            authDomain: "tri-gastos.firebaseapp.com",
            projectId: "tri-gastos",
            storageBucket: "tri-gastos.firebasestorage.app",
            messagingSenderId: "843976544023",
            appId: "1:843976544023:web:569c6e5ad2d3c2dc24f152"
        };

        const COLECCION = "tri_gastos_global";
        const COLECCION_LOGOS = "tri_logos";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const expensesCol = collection(db, COLECCION);
        const logosCol = collection(db, COLECCION_LOGOS);

        let currentExpenses = [];
        let logos = [];
        let pendingLogoId = null;
        let autoLogoId = null;
        let filters = { status: 'all', method: 'all', text: '' };

        const $ = (id) => document.getElementById(id);
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const money = (n) => '$' + (Number(n) || 0).toLocaleString('es-AR', {minimumFractionDigits: 2});

        // ---------- MONTO CON FORMATO AUTOMÁTICO ($ 1.234,56) ----------
        function formatAmountInput(el) {
            const raw = el.value;
            const caret = el.selectionStart ?? raw.length;
            const before = raw.slice(0, caret).replace(/[^0-9,]/g, '').length;

            const clean = raw.replace(/[^0-9,]/g, '');
            const idx = clean.indexOf(',');
            let int = idx === -1 ? clean : clean.slice(0, idx);
            const dec = idx === -1 ? null : clean.slice(idx + 1).replace(/,/g, '').slice(0, 2);

            int = int.replace(/^0+(?=\d)/, '');
            const intFmt = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            const out = clean === '' ? '' : '$ ' + (intFmt || '0') + (dec !== null ? ',' + dec : '');
            el.value = out;

            let pos = out.length;
            if (before === 0) {
                pos = out ? 2 : 0;
            } else {
                let count = 0;
                for (let i = 0; i < out.length; i++) {
                    if (/[0-9,]/.test(out[i])) count++;
                    if (count === before) { pos = i + 1; break; }
                }
            }
            try { el.setSelectionRange(pos, pos); } catch (e) {}
        }
        const parseAmount = (s) => parseFloat(String(s).replace(/[^0-9,]/g, '').replace(',', '.'));
        $('amount').addEventListener('input', (e) => formatAmountInput(e.target));

        // ---------- NOMBRES DE LOGOS EN EL CONCEPTO ----------
        $('desc').addEventListener('input', () => {
            const v = $('desc').value.trim().toLowerCase();
            const match = v ? logos.find(l => l.name.toLowerCase() === v) : null;
            if (match) {
                $('logoSelect').value = match.id;
                autoLogoId = match.id;
            } else if (autoLogoId && $('logoSelect').value === autoLogoId) {
                $('logoSelect').value = '';
                autoLogoId = null;
            }
        });

        $('logoSelect').addEventListener('change', () => {
            autoLogoId = null;
            const l = logos.find(x => x.id === $('logoSelect').value);
            if (l && $('desc').value.trim() === '') $('desc').value = l.name;
        });

        // ---------- LOGOS ----------
        window.toggleLogoPanel = function() { $('logoPanel').classList.toggle('hidden'); };

        $('logoFile').addEventListener('change', () => {
            const file = $('logoFile').files[0];
            const prev = $('logoPreview');
            if (!file) { prev.classList.add('hidden'); return; }
            prev.src = URL.createObjectURL(file);
            prev.classList.remove('hidden');
        });

        function fileToLogo(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const S = 96;
                    const c = document.createElement('canvas');
                    c.width = S; c.height = S;
                    const ctx = c.getContext('2d');
                    const r = Math.min(S / img.width, S / img.height);
                    const w = img.width * r, h = img.height * r;
                    ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
                    URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/webp', 0.85));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
                img.src = url;
            });
        }

        window.saveLogo = async function() {
            const name = $('logoName').value.trim();
            const file = $('logoFile').files[0];
            if (!name) { $('logoMsg').innerText = 'Escribí un nombre para el logo.'; return; }
            if (!file) { $('logoMsg').innerText = 'Elegí una imagen para el logo.'; return; }
            try {
                $('logoMsg').innerText = 'Guardando logo...';
                const img = await fileToLogo(file);
                const ref = await addDoc(logosCol, { name, img, createdAt: new Date().toISOString() });
                pendingLogoId = ref.id;
                $('logoName').value = '';
                $('logoFile').value = '';
                $('logoPreview').classList.add('hidden');
                $('logoMsg').innerText = 'Logo guardado y seleccionado para el próximo gasto.';
            } catch (err) {
                $('logoMsg').innerText = 'No se pudo guardar el logo (' + (err.code || err.message) + ').';
            }
        };

        window.deleteLogo = async function(id) {
            if (!confirm('¿Eliminar este logo? Los gastos anteriores conservan el nombre.')) return;
            try { await deleteDoc(doc(db, COLECCION_LOGOS, id)); }
            catch (err) { alert('Error al eliminar el logo (' + err.code + '): ' + err.message); }
        };

        function renderLogoSelect() {
            const sel = $('logoSelect');
            const actual = pendingLogoId || sel.value;
            sel.innerHTML = '<option value="">Sin logo</option>' +
                logos.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('');
            if (logos.some(l => l.id === actual)) {
                sel.value = actual;
                if (actual === pendingLogoId) pendingLogoId = null;
            }
            $('logoNames').innerHTML = logos.map(l => `<option value="${esc(l.name)}"></option>`).join('');
        }

        function renderLogoList() {
            const box = $('logoList');
            if (logos.length === 0) {
                box.innerHTML = '<span class="text-xs text-slate-500">Todavía no cargaste logos.</span>';
                return;
            }
            box.innerHTML = logos.map(l => `
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg pl-2 pr-1 py-1">
                    <img src="${esc(l.img)}" alt="" class="w-7 h-7 object-contain">
                    <span class="text-xs text-slate-200">${esc(l.name)}</span>
                    <button type="button" onclick="deleteLogo('${esc(l.id)}')" class="text-rose-400 hover:text-rose-300 p-1.5 rounded transition" title="Eliminar logo">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>`).join('');
        }

        onSnapshot(logosCol, (snapshot) => {
            logos = [];
            snapshot.forEach(d => {
                const x = d.data();
                if (x.name && typeof x.img === 'string' && x.img.startsWith('data:image/')) logos.push({ id: d.id, ...x });
            });
            logos.sort((a, b) => a.name.localeCompare(b.name, 'es'));
            renderLogoSelect();
            renderLogoList();
            renderExpenses();
        }, (error) => {
            console.error("Firestore (logos) Error:", error);
            $('logoMsg').innerText = error.code === 'permission-denied'
                ? 'Falta publicar la regla de la colección tri_logos en Firestore.'
                : 'No se pudieron leer los logos (' + error.code + ').';
        });

        // ---------- FILTROS ----------
        function paintStatusChips() {
            document.querySelectorAll('#statusChips button').forEach(b => {
                const active = b.dataset.status === filters.status;
                b.className = 'text-xs font-semibold px-3 py-1.5 rounded-md transition ' +
                    (active ? 'bg-teal-500 text-slate-950' : 'text-slate-300 hover:bg-slate-700');
            });
        }
        window.setStatusFilter = function(s) { filters.status = s; paintStatusChips(); renderExpenses(); };
        window.setMethodFilter = function(m) { filters.method = m; renderExpenses(); };
        window.setTextFilter = function(t) { filters.text = t.trim().toLowerCase(); renderExpenses(); };
        window.clearFilters = function() {
            filters = { status: 'all', method: 'all', text: '' };
            $('methodFilter').value = 'all';
            $('textFilter').value = '';
            paintStatusChips();
            renderExpenses();
        };

        function getFiltered() {
            return currentExpenses.filter(i => {
                const paid = !!i.paid;
                if (filters.status === 'paid' && !paid) return false;
                if (filters.status === 'pending' && paid) return false;
                if (filters.method === 'cards') { if (!String(i.method || '').includes('Tarjeta')) return false; }
                else if (filters.method !== 'all' && i.method !== filters.method) return false;
                if (filters.text && !String(i.desc || '').toLowerCase().includes(filters.text)) return false;
                return true;
            });
        }

        // ---------- GASTOS ----------
        onSnapshot(expensesCol, (snapshot) => {
            $('statusBadge').innerText = "🟢 Nube Conectada";
            $('statusBadge').className = "text-xs text-emerald-400 font-medium";
            $('statSync').innerText = "Sincronizado";

            currentExpenses = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.desc) currentExpenses.push({ id: docSnap.id, ...data });
            });
            renderExpenses();
        }, (error) => {
            console.error("Firestore Error:", error);
            $('statusBadge').innerText = "🔴 Error: " + error.code;
            $('statusBadge').className = "text-xs text-rose-400 font-medium";
            $('statSync').innerText = error.code === 'permission-denied'
                ? "Revisar reglas de Firestore"
                : (error.message || "Error de red");
            $('expenseList').innerHTML =
                `<div class="text-center py-8 text-rose-300 text-sm">No se pudo leer la base: ${esc(error.code)}. Mirá la consola (F12) para más detalle.</div>`;
        });

        window.toggleCardOptions = function() {
            const method = $('paymentMethod').value;
            const cardDetails = $('cardDetails');
            if (method.includes('Tarjeta')) {
                cardDetails.classList.remove('hidden');
            } else {
                cardDetails.classList.add('hidden');
                $('cardAlias').value = '';
                $('dueDate').value = '';
            }
        };

        window.saveExpense = async function(e) {
            e.preventDefault();
            const desc = $('desc').value.trim();
            const amount = parseAmount($('amount').value);
            const method = $('paymentMethod').value;
            const cardAlias = $('cardAlias').value.trim();
            const dueDate = $('dueDate').value;
            const logoId = $('logoSelect').value;
            const logo = logos.find(l => l.id === logoId);

            if (!(amount >= 0)) { alert("Ingresá un monto válido."); return; }

            const expenseData = {
                desc,
                amount,
                method,
                cardAlias: method.includes('Tarjeta') ? cardAlias : 'N/A',
                dueDate: dueDate || 'Sin fecha',
                logoId: logo ? logo.id : '',
                logoName: logo ? logo.name : '',
                paid: false,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(expensesCol, expenseData);
                $('expenseForm').reset();
                autoLogoId = null;
                window.toggleCardOptions();
            } catch (err) {
                alert("Error al guardar en la nube (" + err.code + "): " + err.message);
            }
        };

        window.togglePaid = async function(id) {
            const item = currentExpenses.find(x => x.id === id);
            if (!item) return;
            const nuevo = !item.paid;
            try {
                await updateDoc(doc(db, COLECCION, id), {
                    paid: nuevo,
                    paidAt: nuevo ? new Date().toISOString() : ''
                });
            } catch (err) {
                alert("Error al actualizar (" + err.code + "): " + err.message);
            }
        };

        window.deleteExpense = async function(id) {
            if (confirm("¿Estás seguro de eliminar este gasto?")) {
                try {
                    await deleteDoc(doc(db, COLECCION, id));
                } catch (err) {
                    alert("Error al eliminar (" + err.code + "): " + err.message);
                }
            }
        };

        function logoBadge(item) {
            const l = logos.find(x => x.id === item.logoId);
            if (l) return `<img src="${esc(l.img)}" alt="${esc(l.name)}" title="${esc(l.name)}" class="w-11 h-11 rounded-lg object-contain bg-slate-900/70 p-1 shrink-0">`;
            if (item.logoName) return `<div title="${esc(item.logoName)}" class="w-11 h-11 rounded-lg bg-slate-700 text-slate-200 font-bold flex items-center justify-center shrink-0">${esc(item.logoName.charAt(0).toUpperCase())}</div>`;
            return '';
        }

        function renderExpenses() {
            const list = $('expenseList');
            if (!list) return;

            const filtered = getFiltered();
            const hayFiltros = filters.status !== 'all' || filters.method !== 'all' || filters.text !== '';
            $('counterBadge').innerText = hayFiltros
                ? `${filtered.length} de ${currentExpenses.length} registros`
                : `${currentExpenses.length} registros`;

            const ft = $('filteredTotal');
            if (hayFiltros) {
                const sumF = filtered.reduce((acc, i) => acc + (Number(i.amount) || 0), 0);
                ft.innerText = `Total de los gastos filtrados: ${money(sumF)}`;
                ft.classList.remove('hidden');
            } else {
                ft.classList.add('hidden');
            }

            const total = currentExpenses.reduce((acc, item) => acc + (Number(item.amount) || 0), 0);
            $('statTotal').innerText = money(total);

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diasHasta = (item) => Math.round((new Date(item.dueDate + 'T00:00:00') - today) / 86400000);

            const pendingCount = currentExpenses.filter(item => {
                if (item.paid) return false;
                if (!item.dueDate || item.dueDate === 'Sin fecha') return false;
                const d = diasHasta(item);
                return d >= 0 && d <= 7;
            }).length;
            $('statPending').innerText = pendingCount;

            if (currentExpenses.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No hay gastos registrados todavía. ¡Agregá el primero arriba!</div>`;
                return;
            }
            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Ningún gasto coincide con los filtros.</div>`;
                return;
            }

            filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            list.innerHTML = filtered.map(item => {
                const paid = !!item.paid;
                const tieneTarjeta = item.cardAlias && item.cardAlias !== 'N/A';
                const tieneFecha = item.dueDate && item.dueDate !== 'Sin fecha';
                const vencido = !paid && tieneFecha && diasHasta(item) < 0;
                const fechaCal = tieneFecha ? item.dueDate.replace(/-/g, '') : '';
                const calUrl = tieneFecha
                    ? 'https://calendar.google.com/calendar/render?action=TEMPLATE'
                      + '&text=' + encodeURIComponent('Vencimiento: ' + item.desc)
                      + '&details=' + encodeURIComponent('Monto: ' + money(item.amount) + ' - Tarjeta: ' + (item.cardAlias || ''))
                      + '&dates=' + fechaCal + '/' + fechaCal
                    : '';

                const estadoBadge = paid
                    ? `<span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-md font-semibold">Pagado</span>`
                    : (vencido ? `<span class="text-xs bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-md font-semibold">Vencido</span>` : '');

                return `
                <div class="bg-slate-800/60 p-4 rounded-xl border ${paid ? 'border-emerald-500/30' : 'border-slate-700/50'} flex flex-col md:flex-row justify-between items-start md:items-center gap-3 transition hover:border-teal-500/40">
                    <div class="flex items-center gap-3">
                        ${logoBadge(item)}
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="font-bold text-white text-base">${esc(item.desc)}</h3>
                                <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md">${esc(item.method)}</span>
                                ${estadoBadge}
                            </div>
                            <div class="text-xs text-slate-400 flex flex-wrap gap-3">
                                ${tieneTarjeta ? `<span><i class="fa-solid fa-credit-card text-amber-400"></i> Tarjeta: <strong class="text-amber-300">${esc(item.cardAlias)}</strong></span>` : ''}
                                ${tieneFecha ? `<span><i class="fa-regular fa-calendar text-teal-400"></i> Vence: <strong class="text-teal-300">${esc(item.dueDate)}</strong></span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between w-full md:w-auto gap-4 border-t md:border-t-0 pt-2 md:pt-0 border-slate-700/50">
                        <span class="text-lg font-black ${paid ? 'text-slate-400' : 'text-emerald-400'}">${money(item.amount)}</span>
                        <div class="flex items-center gap-1">
                            <button onclick="togglePaid('${esc(item.id)}')" class="${paid ? 'bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30' : 'text-slate-300 hover:text-emerald-300 hover:bg-emerald-500/10'} px-2.5 py-2 rounded-lg transition text-xs font-semibold flex items-center gap-1.5" title="${paid ? 'Marcar como sin pagar' : 'Marcar como pagado'}">
                                <i class="fa-solid ${paid ? 'fa-circle-check' : 'fa-circle'}"></i> ${paid ? 'Pagado' : 'Pagar'}
                            </button>
                            ${tieneFecha ? `
                            <a href="${esc(calUrl)}" target="_blank" rel="noopener" title="Agregar a Google Calendar" class="bg-teal-600/30 hover:bg-teal-600 text-teal-300 hover:text-white p-2 rounded-lg transition text-xs">
                                <i class="fa-solid fa-calendar-plus"></i>
                            </a>` : ''}
                            <button onclick="deleteExpense('${esc(item.id)}')" class="text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 p-2 rounded-lg transition" title="Eliminar">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        window.exportToExcel = function() {
            const datos = getFiltered();
            if (datos.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            const dataToExport = datos.map(item => ({
                "Descripción": item.desc,
                "Logo": item.logoName || "",
                "Monto ($)": item.amount,
                "Estado": item.paid ? "Pagado" : "Sin pagar",
                "Forma de Pago": item.method,
                "Alias de Tarjeta": item.cardAlias || "",
                "Fecha de Vencimiento": item.dueDate || "",
                "Fecha de Registro": item.createdAt ? item.createdAt.substring(0, 10) : ""
            }));
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Gastos TRI");
            XLSX.writeFile(wb, "Control_Gastos_TRI.xlsx");
        };
    </script>
</body>
</html>

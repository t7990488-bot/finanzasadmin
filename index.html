<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRI - Control de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b132b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER TRI -->
    <header class="glass-card sticky top-0 z-50 border-b border-slate-700/50 mb-6 px-4 py-3">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-teal-500 to-emerald-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xl tracking-wider shadow-lg shadow-teal-500/20">
                    TRI
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none text-white">Control de Gastos</h1>
                    <span id="statusBadge" class="text-xs text-amber-400 font-medium">Conectando...</span>
                </div>
            </div>
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-file-excel"></i> Exportar
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 space-y-6">
        <!-- ALERTA DE ERROR DE DIAGNÓSTICO -->
        <div id="errorBox" class="hidden bg-rose-900/80 border border-rose-500 text-rose-200 p-4 rounded-xl text-sm">
            <strong>Error de conexión detectado:</strong>
            <p id="errorMessage" class="mt-1 font-mono text-xs"></p>
        </div>

        <!-- FORMULARIO DE GASTO -->
        <section class="glass-card p-5 rounded-2xl">
            <h2 class="text-base font-semibold mb-4 text-teal-300 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Nuevo Gasto
            </h2>
            <form id="expenseForm" onsubmit="saveExpense(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Descripción</label>
                    <input type="text" id="desc" required placeholder="Ej: Supermercado" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Monto (\$)</label>
                    <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Forma de Pago</label>
                    <select id="paymentMethod" onchange="toggleCardOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400">
                        <option value="Efectivo">Efectivo / Transferencia</option>
                        <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                    </select>
                </div>

                <div id="cardDetails" class="hidden col-span-1 md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                    <div>
                        <label class="block text-xs font-medium text-amber-300 mb-1">Nombre / Alias de la Tarjeta</label>
                        <input type="text" id="cardAlias" placeholder="Ej: Visa Santander Titular" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Fecha de Vencimiento / Pago</label>
                        <input type="date" id="dueDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400">
                    </div>
                </div>

                <div class="col-span-1 md:col-span-2 lg:col-span-3 flex justify-end">
                    <button type="submit" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-teal-500/20 transition">
                        Guardar Gasto
                    </button>
                </div>
            </form>
        </section>

        <!-- LISTA DE GASTOS -->
        <section class="glass-card p-5 rounded-2xl">
            <h2 class="text-base font-semibold mb-4 text-slate-200">Historial de Gastos</h2>
            <div id="expenseList" class="space-y-3">
                <p class="text-slate-400 text-sm text-center py-4">Cargando datos de la nube...</p>
            </div>
        </section>
    </main>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXqG0SaBCS8bN42mQG8VcayYJuGzdXfM",
            authDomain: "tri-gastos.firebaseapp.com",
            projectId: "tri-gastos",
            storageBucket: "tri-gastos.firebasestorage.app",
            messagingSenderId: "843976544023",
            appId: "1:843976544023:web:569c6e5ad2d3c2dc24f152"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const expensesCol = collection(db, "tri_gastos_global");

        let currentExpenses = [];

        // Escuchar en tiempo real
        onSnapshot(expensesCol, (snapshot) => {
            document.getElementById('statusBadge').innerText = "🟢 Nube Conectada";
            document.getElementById('statusBadge').className = "text-xs text-emerald-400 font-medium";
            document.getElementById('errorBox').classList.add('hidden');

            currentExpenses = [];
            snapshot.forEach(docSnap => {
                currentExpenses.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderExpenses();
        }, (error) => {
            console.error("Firestore Error:", error);
            document.getElementById('statusBadge').innerText = "🔴 Error de Nube";
            document.getElementById('statusBadge').className = "text-xs text-rose-400 font-medium";
            document.getElementById('errorBox').classList.remove('hidden');
            document.getElementById('errorMessage').innerText = error.message + " (" + error.code + ")";
        });

        window.toggleCardOptions = function() {
            const method = document.getElementById('paymentMethod').value;
            const cardDetails = document.getElementById('cardDetails');
            if (method.includes('Tarjeta')) {
                cardDetails.classList.remove('hidden');
            } else {
                cardDetails.classList.add('hidden');
            }
        };

        window.saveExpense = async function(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const method = document.getElementById('paymentMethod').value;
            const cardAlias = document.getElementById('cardAlias').value;
            const dueDate = document.getElementById('dueDate').value;

            const expenseData = {
                desc,
                amount,
                method,
                cardAlias: method.includes('Tarjeta') ? cardAlias : '',
                dueDate: method.includes('Tarjeta') ? dueDate : '',
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(expensesCol, expenseData);
                document.getElementById('expenseForm').reset();
                window.toggleCardOptions();
            } catch (err) {
                alert("Error al guardar: " + err.message);
            }
        };

        window.deleteExpense = async function(id) {
            if (confirm("¿Eliminar este gasto?")) {
                await deleteDoc(doc(db, "tri_gastos_global", id));
            }
        };

        function renderExpenses() {
            const list = document.getElementById('expenseList');
            if (currentExpenses.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-sm text-center py-4">No hay gastos registrados aún.</p>`;
                return;
            }

            list.innerHTML = currentExpenses.map(item => `
                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-white">${item.desc}</h3>
                        <p class="text-xs text-slate-400">
                            ${item.method} ${item.cardAlias ? '• <span class="text-amber-300">' + item.cardAlias + '</span>' : ''}
                        </p>
                        ${item.dueDate ? `<p class="text-xs text-teal-400 mt-1"><i class="fa-regular fa-calendar"></i> Vence: \${item.dueDate}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-lg font-black text-emerald-400">$${item.amount.toLocaleString()}</span>
                        <button onclick="deleteExpense('${item.id}')" class="text-rose-400 hover:text-rose-300 p-2">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.exportToExcel = function() {
            const ws = XLSX.utils.json_to_sheet(currentExpenses);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Gastos TRI");
            XLSX.writeFile(wb, "Gastos_TRI.xlsx");
        };
    </script>
</body>
</html>
